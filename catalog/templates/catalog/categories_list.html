{% extends 'catalog/base.html' %}

{% block content %}
<div class="container mt-4">
    <h1 class="text-center mb-4">Категории товаров</h1>
    
    <div class="row">
        {% for category in categories %}
        <div class="col-md-4 mb-3">
            <div class="card h-100">
                <div class="card-body">
                    <h5 class="card-title">{{ category.name }}</h5>
                    <p class="card-text">{{ category.description|truncatewords:100 }}</p>
                </div>
                <div class="card-footer">
                    <a href="{% url 'catalog:category_products' category.name %}" 
                       class="btn btn-primary w-100">
                        Смотреть товары ({{ category.products.count }})
                    </a>
                </div>
            </div>
        </div>
        {% empty %}
        <div class="col-12">
            <p class="text-center">Категории не найдены</p>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
