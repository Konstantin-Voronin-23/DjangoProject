{% extends 'blogs/base.html' %}

{% block title %}Удаление записи: {{ object.title }}{% endblock %}

{% block content %}
<h1>Подтверждение удаления</h1>

<p>Вы действительно хотите удалить запись <strong>{{ object.title }}</strong>?</p>

<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Удалить</button>
    <a href="{% url 'blogs:blog_detail' object.pk %}" class="btn btn-secondary ms-2">Отмена</a>
</form>
{% endblock %}
